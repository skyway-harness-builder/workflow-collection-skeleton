# Pre-commit gate: fast local checks before code lands in git.
#
# Layer 1 — skyway lint : validates staged .sky workflow files
# Layer 2 — manifest    : checks manifest.yaml stays in sync with disk
# Layer 3 — bash syntax : bash -n on staged shell scripts (syntax only)
# Layer 4 — yaml check  : scripts/yaml-check.sh on staged YAML files
#                         (layer 1 = python yaml.safe_load; layer 2 = yamllint if present)
#
# Full static analysis (shellcheck, yamllint) also runs in CI on every push.
pre-commit:
  jobs:
    - name: skyway lint
      glob: "**/*.sky"
      run: skyway lint {staged_files}

    - name: manifest validate
      glob: "manifest.yaml"
      run: bash scripts/validate-manifest.sh

    - name: bash syntax
      glob: "**/*.sh"
      run: bash -n {staged_files}

    - name: yaml check
      glob: "**/*.{yaml,yml}"
      run: bash scripts/yaml-check.sh {staged_files}
