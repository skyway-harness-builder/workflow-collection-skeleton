apiVersion: skylence.be/v1
version: 1.0.0
updated_at: "__today__"

# ── Library metadata ──────────────────────────────────────────────────────────
# Remove or customise the stores block. Each store groups entries by plugin and
# lets `sky library` filter them. One store entry per logical category is enough.
#
# stores:
#   - name: __vendor__
#     plugin: my-plugin
#     description: "Short description of this category"

# ── Entries ──────────────────────────────────────────────────────────────────
# Each entry maps a workflow or skill file to a name that `sky` can reference.
# Run `bash scripts/validate-manifest.sh` locally to check for drift.
entries:
  - kind: workflow
    name: hello-world
    path: workflows/__vendor__/hello-world/workflow.sky
    description: "Starter workflow — prints a greeting. Replace with your first automation."
    tags: [__vendor__, manual]
    scripts:
      - workflows/__vendor__/hello-world/scripts/run.sh
