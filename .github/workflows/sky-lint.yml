name: Sky lint
on:
  workflow_dispatch:

jobs:
  sky-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: skylence-be/sky-lint-action@v2
        with:
          paths: "**/*.sky"

  manifest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest.yaml
        run: bash scripts/validate-manifest.sh
